<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电解铝氧化铝浓度在线检测与槽控优化系统</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.0/dist/browser/signalr.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei','Segoe UI',sans-serif;background:#0a0e1a;color:#e0e6f0;overflow:hidden;height:100vh}
.header{background:linear-gradient(135deg,#0d1b2a,#1b2838);padding:12px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1e3a5f;height:56px}
.header h1{font-size:18px;font-weight:600;color:#4fc3f7;letter-spacing:1px}
.header-stats{display:flex;gap:24px;font-size:13px}
.header-stats .stat{display:flex;align-items:center;gap:6px}
.stat-dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.stat-dot.green{background:#4caf50;box-shadow:0 0 6px #4caf50}
.stat-dot.yellow{background:#ff9800;box-shadow:0 0 6px #ff9800}
.stat-dot.red{background:#f44336;box-shadow:0 0 6px #f44336}
.stat-dot.flash{background:#f44336;animation:flash-anim 0.5s infinite alternate}
@keyframes flash-anim{0%{opacity:1;box-shadow:0 0 10px #f44336}100%{opacity:0.3;box-shadow:0 0 2px #f44336}}
.main{display:flex;height:calc(100vh - 56px)}
.canvas-panel{flex:1;position:relative;padding:10px}
#cellCanvas{width:100%;height:100%;cursor:pointer}
.detail-panel{width:0;overflow:hidden;transition:width 0.3s ease;background:#0f1923;border-left:1px solid #1e3a5f;display:flex;flex-direction:column}
.detail-panel.open{width:480px}
.detail-header{padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1e3a5f;background:#111b27}
.detail-header h2{font-size:15px;color:#4fc3f7}
.close-btn{background:none;border:1px solid #2a4a6b;color:#7eb8da;width:28px;height:28px;border-radius:4px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.close-btn:hover{background:#1e3a5f}
.detail-content{flex:1;overflow-y:auto;padding:16px}
.detail-section{margin-bottom:20px}
.detail-section h3{font-size:13px;color:#7eb8da;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid #1a2d42}
.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.status-item{background:#111b27;padding:10px;border-radius:6px;border:1px solid #1a2d42}
.status-item .label{font-size:11px;color:#5a7a9a;margin-bottom:2px}
.status-item .value{font-size:16px;font-weight:600}
.value.green{color:#4caf50}.value.yellow{color:#ff9800}.value.red{color:#f44336}.value.blue{color:#4fc3f7}
.chart-container{background:#0a1220;border-radius:6px;padding:12px;border:1px solid #1a2d42;height:200px;position:relative}
.chart-container canvas{width:100%!important;height:100%!important}
.feed-table{width:100%;border-collapse:collapse;font-size:12px}
.feed-table th{background:#111b27;padding:6px 8px;text-align:left;color:#7eb8da;border-bottom:1px solid #1a2d42;font-weight:500}
.feed-table td{padding:6px 8px;border-bottom:1px solid #0f1923}
.feed-table tr:hover{background:#111b27}
.feed-type{padding:2px 6px;border-radius:3px;font-size:11px}
.feed-type.auto{background:#1a3a2a;color:#4caf50}
.feed-type.manual{background:#1a2a3a;color:#4fc3f7}
.feed-type.quench{background:#3a1a1a;color:#f44336}
.alarm-bar{position:fixed;bottom:0;left:0;right:0;height:36px;background:#1a0a0a;border-top:1px solid #5a1a1a;display:flex;align-items:center;padding:0 20px;gap:16px;font-size:12px;z-index:100}
.alarm-bar .alarm-item{display:flex;align-items:center;gap:6px}
.alarm-bar .alarm-dot{width:8px;height:8px;border-radius:50%;background:#f44336;animation:flash-anim 0.5s infinite alternate}
.tooltip{position:absolute;background:#111b27;border:1px solid #2a4a6b;border-radius:6px;padding:8px 12px;font-size:12px;pointer-events:none;z-index:50;display:none;white-space:nowrap}
</style>
</head>
<body>
<div class="header">
  <h1>⚡ 电解铝氧化铝浓度在线检测与槽控优化系统</h1>
  <div class="header-stats">
    <div class="stat"><span class="stat-dot green"></span>正常: <span id="normalCount">0</span></div>
    <div class="stat"><span class="stat-dot yellow"></span>偏低: <span id="lowCount">0</span></div>
    <div class="stat"><span class="stat-dot red"></span>极低: <span id="criticalCount">0</span></div>
    <div class="stat"><span class="stat-dot flash"></span>效应预警: <span id="effectCount">0</span></div>
    <div class="stat" style="color:#5a7a9a">数据时间: <span id="dataTime">--</span></div>
  </div>
</div>
<div class="main">
  <div class="canvas-panel">
    <canvas id="cellCanvas"></canvas>
    <div class="tooltip" id="tooltip"></div>
  </div>
  <div class="detail-panel" id="detailPanel">
    <div class="detail-header">
      <h2 id="detailTitle">电解槽详情</h2>
      <button class="close-btn" onclick="closeDetail()">✕</button>
    </div>
    <div class="detail-content" id="detailContent">
      <div class="detail-section">
        <h3>实时状态</h3>
        <div class="status-grid" id="statusGrid"></div>
      </div>
      <div class="detail-section">
        <h3>槽电压趋势 (近8小时)</h3>
        <div class="chart-container"><canvas id="voltageChart"></canvas></div>
      </div>
      <div class="detail-section">
        <h3>阳极电流分布趋势 (近8小时)</h3>
        <div class="chart-container"><canvas id="currentChart"></canvas></div>
      </div>
      <div class="detail-section">
        <h3>最近10次打完壳下料记录</h3>
        <table class="feed-table">
          <thead><tr><th>时间</th><th>下料量(kg)</th><th>类型</th><th>触发原因</th></tr></thead>
          <tbody id="feedTableBody"></tbody>
        </table>
      </div>
      <div class="detail-section">
        <h3>阳极效应预测</h3>
        <div class="status-grid">
          <div class="status-item"><div class="label">预测概率</div><div class="value blue" id="predProb">--</div></div>
          <div class="status-item"><div class="label">预测时间</div><div class="value blue" id="predTime">--</div></div>
        </div>
      </div>
      <div class="detail-section">
        <button onclick="manualFeed()" style="background:#1a3a5a;border:1px solid #2a5a8a;color:#4fc3f7;padding:8px 20px;border-radius:4px;cursor:pointer;width:100%">手动补料 (25kg)</button>
      </div>
    </div>
  </div>
</div>
<div class="alarm-bar" id="alarmBar">
  <span style="color:#f44336;font-weight:600">⚠ 告警信息</span>
  <span id="alarmContent" style="color:#e0a0a0">暂无活动告警</span>
</div>

<script>
const COLS = 20, ROWS = 10, TOTAL = 200;
const API_BASE = window.location.origin;
let cells = {};
let selectedCellId = null;
let voltageChart = null, currentChart = null;
let connection = null;
let hoverCellId = null;
let flashCells = new Set();

class CellCanvas {
  constructor(canvasId) {
    this.canvas = document.getElementById(canvasId);
    this.ctx = this.canvas.getContext('2d');
    this.cellRects = {};
    this.resize();
    window.addEventListener('resize', () => this.resize());
    this.canvas.addEventListener('click', (e) => this.onClick(e));
    this.canvas.addEventListener('mousemove', (e) => this.onMouseMove(e));
    this.canvas.addEventListener('mouseleave', () => {
      document.getElementById('tooltip').style.display = 'none';
      hoverCellId = null;
    });
  }

  resize() {
    const rect = this.canvas.parentElement.getBoundingClientRect();
    this.canvas.width = rect.width * devicePixelRatio;
    this.canvas.height = rect.height * devicePixelRatio;
    this.canvas.style.width = rect.width + 'px';
    this.canvas.style.height = rect.height + 'px';
    this.ctx.scale(devicePixelRatio, devicePixelRatio);
    this.w = rect.width;
    this.h = rect.height;
    this.computeLayout();
    this.draw();
  }

  computeLayout() {
    const pad = 30;
    const areaW = this.w - pad * 2;
    const areaH = this.h - pad * 2;
    const gapX = 6, gapY = 6;
    const cellW = (areaW - gapX * (COLS - 1)) / COLS;
    const cellH = (areaH - gapY * (ROWS - 1)) / ROWS;
    this.cellRects = {};
    for (let i = 0; i < TOTAL; i++) {
      const row = Math.floor(i / COLS);
      const col = i % COLS;
      const x = pad + col * (cellW + gapX);
      const y = pad + row * (cellH + gapY);
      this.cellRects[i + 1] = { x, y, w: cellW, h: cellH, row, col };
    }
    this.cellW = cellW;
    this.cellH = cellH;
  }

  getCellColor(cellId) {
    const c = cells[cellId];
    if (!c) return '#1a2d42';
    if (c.isFlashing || c.status === '效应预警') {
      const phase = (Date.now() / 300) % 2;
      return phase < 1 ? '#f44336' : '#8b0000';
    }
    switch (c.concentrationStatus) {
      case '极低': return '#d32f2f';
      case '偏低': return '#f57c00';
      case '正常': default: return '#2e7d32';
    }
  }

  getCellBorderColor(cellId) {
    const c = cells[cellId];
    if (!c) return '#1e3a5f';
    if (c.isFlashing) return '#ff5252';
    if (selectedCellId === cellId) return '#4fc3f7';
    return '#1e3a5f';
  }

  draw() {
    const ctx = this.ctx;
    ctx.clearRect(0, 0, this.w, this.h);

    ctx.fillStyle = '#0a1220';
    ctx.fillRect(0, 0, this.w, this.h);

    for (let id = 1; id <= TOTAL; id++) {
      const r = this.cellRects[id];
      if (!r) continue;
      const c = cells[id];

      ctx.fillStyle = this.getCellColor(id);
      ctx.beginPath();
      const radius = 3;
      ctx.moveTo(r.x + radius, r.y);
      ctx.lineTo(r.x + r.w - radius, r.y);
      ctx.quadraticCurveTo(r.x + r.w, r.y, r.x + r.w, r.y + radius);
      ctx.lineTo(r.x + r.w, r.y + r.h - radius);
      ctx.quadraticCurveTo(r.x + r.w, r.y + r.h, r.x + r.w - radius, r.y + r.h);
      ctx.lineTo(r.x + radius, r.y + r.h);
      ctx.quadraticCurveTo(r.x, r.y + r.h, r.x, r.y + r.h - radius);
      ctx.lineTo(r.x, r.y + radius);
      ctx.quadraticCurveTo(r.x, r.y, r.x + radius, r.y);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = this.getCellBorderColor(id);
      ctx.lineWidth = selectedCellId === id ? 2 : 1;
      ctx.stroke();

      ctx.fillStyle = '#e0e6f0';
      ctx.font = `bold ${Math.max(9, Math.min(12, this.cellW * 0.22))}px 'Microsoft YaHei'`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(id), r.x + r.w / 2, r.y + r.h / 2 - 6);

      if (c) {
        ctx.font = `${Math.max(7, Math.min(10, this.cellW * 0.18))}px 'Microsoft YaHei'`;
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        const concText = c.concentration != null ? c.concentration.toFixed(1) + '%' : '--';
        ctx.fillText(concText, r.x + r.w / 2, r.y + r.h / 2 + 7);
      }
    }

    const hasFlashing = Object.values(cells).some(c => c.isFlashing || c.status === '效应预警');
    if (hasFlashing) requestAnimationFrame(() => this.draw());
  }

  hitTest(mx, my) {
    for (let id = 1; id <= TOTAL; id++) {
      const r = this.cellRects[id];
      if (r && mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h) return id;
    }
    return null;
  }

  onClick(e) {
    const rect = this.canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const cellId = this.hitTest(mx, my);
    if (cellId) openDetail(cellId);
  }

  onMouseMove(e) {
    const rect = this.canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const cellId = this.hitTest(mx, my);
    const tooltip = document.getElementById('tooltip');

    if (cellId && cells[cellId]) {
      const c = cells[cellId];
      hoverCellId = cellId;
      tooltip.innerHTML = `<b>${c.cellName || '电解槽-' + cellId}</b><br>浓度: ${c.concentration?.toFixed(2) || '--'}% (${c.concentrationStatus})<br>电压: ${c.voltage?.toFixed(2) || '--'}V<br>效应概率: ${c.anodeEffectProbability?.toFixed(1) || '0'}%`;
      tooltip.style.display = 'block';
      tooltip.style.left = (e.clientX + 12) + 'px';
      tooltip.style.top = (e.clientY - 40) + 'px';
    } else {
      tooltip.style.display = 'none';
      hoverCellId = null;
    }
  }
}

let canvas;

async function fetchCells() {
  try {
    const res = await fetch(`${API_BASE}/api/cells`);
    const data = await res.json();
    data.forEach(c => {
      cells[c.cellId] = c;
    });
    updateStats();
    canvas.draw();
  } catch (e) {
    console.warn('Failed to fetch cells:', e);
  }
}

function updateStats() {
  let normal = 0, low = 0, critical = 0, effect = 0;
  Object.values(cells).forEach(c => {
    if (c.isFlashing || c.status === '效应预警') effect++;
    else if (c.concentrationStatus === '极低') critical++;
    else if (c.concentrationStatus === '偏低') low++;
    else normal++;
  });
  document.getElementById('normalCount').textContent = normal;
  document.getElementById('lowCount').textContent = low;
  document.getElementById('criticalCount').textContent = critical;
  document.getElementById('effectCount').textContent = effect;
}

async function openDetail(cellId) {
  selectedCellId = cellId;
  const panel = document.getElementById('detailPanel');
  panel.classList.add('open');
  canvas.draw();

  const c = cells[cellId];
  document.getElementById('detailTitle').textContent = c?.cellName || `电解槽-${cellId}`;

  updateStatusGrid(cellId);
  await loadHistory(cellId);
  await loadFeedings(cellId);
  await loadPredictions(cellId);
}

function updateStatusGrid(cellId) {
  const c = cells[cellId];
  if (!c) return;
  const concClass = c.concentrationStatus === '极低' ? 'red' : c.concentrationStatus === '偏低' ? 'yellow' : 'green';
  const probVal = c.anodeEffectProbability ?? 0;
  const probClass = probVal >= 80 ? 'red' : probVal >= 50 ? 'yellow' : 'green';

  document.getElementById('statusGrid').innerHTML = `
    <div class="status-item"><div class="label">氧化铝浓度</div><div class="value ${concClass}">${c.concentration?.toFixed(2) || '--'}%</div></div>
    <div class="status-item"><div class="label">浓度状态</div><div class="value ${concClass}">${c.concentrationStatus}</div></div>
    <div class="status-item"><div class="label">槽电压</div><div class="value blue">${c.voltage?.toFixed(2) || '--'} V</div></div>
    <div class="status-item"><div class="label">效应概率</div><div class="value ${probClass}">${probVal.toFixed(1)}%</div></div>
    <div class="status-item"><div class="label">槽状态</div><div class="value ${c.status === '正常' ? 'green' : 'red'}">${c.status}</div></div>
    <div class="status-item"><div class="label">最后数据</div><div class="value blue" style="font-size:12px">${c.lastDataTime ? new Date(c.lastDataTime).toLocaleTimeString() : '--'}</div></div>
  `;
}

async function loadHistory(cellId) {
  try {
    const res = await fetch(`${API_BASE}/api/cells/${cellId}/history?hours=8`);
    const data = await res.json();

    if (voltageChart) voltageChart.destroy();
    if (currentChart) currentChart.destroy();

    const vCtx = document.getElementById('voltageChart').getContext('2d');
    voltageChart = new Chart(vCtx, {
      type: 'line',
      data: {
        labels: data.voltageSeries.map(p => new Date(p.timestamp).toLocaleTimeString()),
        datasets: [{
          label: '槽电压 (V)',
          data: data.voltageSeries.map(p => p.value),
          borderColor: '#4fc3f7',
          backgroundColor: 'rgba(79,195,247,0.1)',
          fill: true,
          tension: 0.3,
          pointRadius: 0,
          borderWidth: 1.5
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { labels: { color: '#7eb8da', font: { size: 11 } } } },
        scales: {
          x: { ticks: { color: '#5a7a9a', font: { size: 9 }, maxTicksLimit: 8 }, grid: { color: '#1a2d42' } },
          y: { ticks: { color: '#5a7a9a', font: { size: 10 } }, grid: { color: '#1a2d42' }, suggestedMin: 3.5, suggestedMax: 5 }
        }
      }
    });

    const cCtx = document.getElementById('currentChart').getContext('2d');
    currentChart = new Chart(cCtx, {
      type: 'line',
      data: {
        labels: data.currentDistributionSeries.map(p => new Date(p.timestamp).toLocaleTimeString()),
        datasets: [{
          label: '电流均值 (kA)',
          data: data.currentDistributionSeries.map(p => p.mean),
          borderColor: '#4caf50',
          backgroundColor: 'rgba(76,175,80,0.1)',
          fill: false,
          tension: 0.3,
          pointRadius: 0,
          borderWidth: 1.5
        }, {
          label: '电流标准差 (kA)',
          data: data.currentDistributionSeries.map(p => p.stdDev),
          borderColor: '#ff9800',
          backgroundColor: 'rgba(255,152,0,0.1)',
          fill: false,
          tension: 0.3,
          pointRadius: 0,
          borderWidth: 1.5
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { labels: { color: '#7eb8da', font: { size: 11 } } } },
        scales: {
          x: { ticks: { color: '#5a7a9a', font: { size: 9 }, maxTicksLimit: 8 }, grid: { color: '#1a2d42' } },
          y: { ticks: { color: '#5a7a9a', font: { size: 10 } }, grid: { color: '#1a2d42' } }
        }
      }
    });
  } catch (e) {
    console.warn('Failed to load history:', e);
  }
}

async function loadFeedings(cellId) {
  try {
    const res = await fetch(`${API_BASE}/api/cells/${cellId}/feedings`);
    const data = await res.json();
    const tbody = document.getElementById('feedTableBody');
    tbody.innerHTML = data.map(f => {
      const typeClass = f.feedType === '自动' ? 'auto' : f.feedType === '手动' ? 'manual' : 'quench';
      return `<tr><td>${new Date(f.timestamp).toLocaleString()}</td><td>${f.feedAmountKg}</td><td><span class="feed-type ${typeClass}">${f.feedType}</span></td><td style="font-size:11px;color:#7eb8da">${f.triggerReason || '-'}</td></tr>`;
    }).join('');
  } catch (e) {
    console.warn('Failed to load feedings:', e);
  }
}

async function loadPredictions(cellId) {
  try {
    const res = await fetch(`${API_BASE}/api/cells/${cellId}/predictions`);
    const data = await res.json();
    if (data.length > 0) {
      const latest = data[0];
      document.getElementById('predProb').textContent = latest.probability.toFixed(1) + '%';
      document.getElementById('predTime').textContent = `提前${latest.predictedMinutesAhead}分钟`;
    }
  } catch (e) {
    console.warn('Failed to load predictions:', e);
  }
}

function closeDetail() {
  selectedCellId = null;
  document.getElementById('detailPanel').classList.remove('open');
  canvas.draw();
}

async function manualFeed() {
  if (!selectedCellId) return;
  try {
    await fetch(`${API_BASE}/api/cells/${selectedCellId}/feed`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ amountKg: 25, reason: '手动补料' })
    });
    await loadFeedings(selectedCellId);
  } catch (e) {
    console.warn('Manual feed failed:', e);
  }
}

async function loadAlarms() {
  try {
    const res = await fetch(`${API_BASE}/api/alarms?activeOnly=true`);
    const alarms = await res.json();
    const bar = document.getElementById('alarmContent');
    if (alarms.length === 0) {
      bar.textContent = '暂无活动告警';
      bar.style.color = '#7a9aba';
    } else {
      bar.innerHTML = alarms.slice(0, 3).map(a =>
        `<span class="alarm-item"><span class="alarm-dot"></span>[${a.alarmLevel === 1 ? '一级浓度告警' : '二级效应告警'}] 槽${a.cellId}号 - ${a.message.substring(0, 40)}...</span>`
      ).join('');
      bar.style.color = '#e0a0a0';
    }
  } catch (e) { }
}

function initSignalR() {
  connection = new signalR.HubConnectionBuilder()
    .withUrl(`${API_BASE}/hubs/cell`)
    .withAutomaticReconnect([0, 2000, 5000, 10000, 30000])
    .build();

  connection.on('CellStatusUpdate', (status) => {
    cells[status.cellId] = status;
    updateStats();
    canvas.draw();
    document.getElementById('dataTime').textContent = new Date().toLocaleTimeString();

    if (selectedCellId === status.cellId) {
      updateStatusGrid(selectedCellId);
    }
  });

  connection.on('FeedingExecuted', (data) => {
    if (selectedCellId === data.cellId) loadFeedings(selectedCellId);
  });

  connection.start()
    .then(() => console.log('SignalR connected'))
    .catch(e => console.warn('SignalR connection failed:', e));
}

function init() {
  canvas = new CellCanvas('cellCanvas');
  fetchCells();
  initSignalR();
  setInterval(loadAlarms, 5000);
  loadAlarms();
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
